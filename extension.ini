name = doom
owner = rhun-editor
title = DOOM
description = The original DOOM engine, playable in a rhun editor tab.
version = 0.1.0
protocol = 1
run.macos-arm64 = bin/doom-macos-arm64
run.linux-x86_64 = bin/doom-linux-x86_64
run.windows-x64 = bin/doom-windows-x64.exe
on = command
where = local
color = #a83c30

[commands]
play = DOOM: Play
new_game = DOOM: New Game
pause = DOOM: Pause or Resume
mute = DOOM: Toggle Sound

[needs]
audio = yes
documents = none
network = no
terminal = no
