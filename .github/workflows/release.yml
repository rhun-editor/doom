name: release
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: macos-arm64, os: macos-15}
          - {target: linux-x86_64, os: ubuntu-22.04}
          - {target: windows-x64, os: windows-2022}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Preserve source and patch line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vshvedov/rhun
          ref: v0.18.2
          path: build/rhun-host
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Linux build and audio tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -qq clang zlib1g-dev pulseaudio libpulse0 libasound2 xvfb xdotool openbox
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc
      - name: Windows tool paths
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          echo "$(cygpath -m /mingw64/bin)" >> "$GITHUB_PATH"
          echo "CC=$(cygpath -m /mingw64/bin/gcc.exe)" >> "$GITHUB_ENV"
      - name: Build Unix extension
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          make -s -j4
      - name: Build Windows extension
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -s -j4 CC=gcc
      - name: Verify official editor and published DOOM downloads
        run: python tools/fetch-rhun.py ${{ matrix.target }}
      - name: Configure test audio
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/doom-audio"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=doom-test
            pactl set-default-sink doom-test
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          else
            echo 'DOOM_AUDIO_BACKEND=null' >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        run: python tests/unit.py
      - name: Audit runtime dependencies
        run: python tools/audit-binary.py ${{ matrix.target }}
      - name: Build installation archive
        run: python tools/package.py ${{ matrix.target }}
      - name: Test the packaged binary in the native editor
        env:
          DOOM_PACKAGE_ROOT: ${{ github.workspace }}/build/package/${{ matrix.target }}/doom
        run: python tests/run.py
      - name: Test published DOOM in the released editor
        env:
          DOOM_PACKAGE_ROOT: ${{ env.DOOM_PUBLISHED_ROOT }}
          DOOM_TEST_RESULTS: build/test-results/published
        run: python tests/run.py
      - name: Protocol conformance on the package
        env:
          DOOM_PACKAGE_ROOT: ${{ github.workspace }}/build/package/${{ matrix.target }}/doom
          DOOM_DIAGNOSTICS: '1'
          DOOM_AUDIO_BACKEND: 'null'
        run: python tools/check.py
      - name: Install the release archive through rhun
        run: python tests/install.py
      - name: Native Linux key events
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/native-input.py
      - name: Native Windows key events
        if: runner.os == 'Windows'
        run: python tests/native-input.py
      - name: Editor picture regressions
        env:
          RHUN_TEST_EXE: ${{ env.DOOM_RHUN }}
        run: python build/rhun-host/tests/ext-views-picture.py
      - name: Package the separate editor preview
        run: python tools/package-preview.py ${{ matrix.target }}
      - name: Test the extracted preview launcher
        run: python tests/preview.py
      - name: Complete corresponding source archives
        if: runner.os == 'Linux'
        run: python tools/source-archives.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.target }}
          path: build/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Check version, packages and checksums
        run: |
          set -e
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version *= *//p' extension.ini)"
          test -s dist/doom-macos-arm64.tar.gz
          test -s dist/doom-linux-x86_64.tar.gz
          test -s dist/doom-windows-x64.tar.gz
          test -s dist/rhun-doom-preview-macos-arm64.zip
          test -s dist/rhun-doom-preview-linux-x86_64.tar.gz
          test -s dist/rhun-doom-preview-windows-x64.zip
          test -s dist/doom-source.tar.gz
          test -s dist/rhun-preview-source.tar.gz
          (cd dist && sha256sum *.tar.gz *.zip > sha256sums.txt && sha256sum -c sha256sums.txt)
      - uses: actions/attest-build-provenance@v2
        if: github.event.repository.private == false
        with:
          subject-path: dist/doom-*.tar.gz
      - name: Publish the tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft $pre \
            --title "DOOM in rhun $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
